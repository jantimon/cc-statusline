[package]
name = "cc-statusline"
version = "0.1.0"
edition = "2021"
description = "Two-row Claude Code statusline with ccusage-style per-session token breakdown"

[[bin]]
name = "cc-statusline"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
